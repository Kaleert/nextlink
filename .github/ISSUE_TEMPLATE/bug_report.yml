name: Bug report
description: Report a NextLink bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Что сломалось?
      description: Шаги воспроизведения, ожидаемое и фактическое поведение.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Nextlink
      placeholder: 1.0.0-beta+4, Original / Shadow
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android / устройство
      placeholder: Android 14, модель
  - type: textarea
    id: logs
    attributes:
      label: Логи без личных данных
      description: Удали ключи подписок, IP, токены, приватные конфиги.
      render: shell
